<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebGL Stanza Navigabile</title>
    <script src="https://twgljs.org/dist/4.x/twgl-full.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; }
        canvas { display: block; width: 100vw; height: 100vh; }
    </style>
</head>
<body>
    <canvas id="webgl-canvas"></canvas>
    <script>
        const m4 = twgl.m4;
        const v3 = twgl.v3;
        const gl = document.querySelector("canvas").getContext("webgl");

        // Vertex Shader
        const vs = `
        uniform mat4 u_worldViewProjection;
        uniform mat4 u_worldInverseTranspose;
        attribute vec4 position;
        attribute vec3 normal;
        varying vec3 v_normal;
        void main() {
            gl_Position = u_worldViewProjection * position;
            v_normal = (u_worldInverseTranspose * vec4(normal, 0)).xyz;
        }`;

        // Fragment Shader con illuminazione
        const fs = `
        precision mediump float;
        varying vec3 v_normal;
        uniform vec3 u_lightDir;
        uniform vec4 u_color;
        void main() {
            vec3 norm = normalize(v_normal);
            float light = dot(u_lightDir, norm) * 0.5 + 0.5;
            gl_FragColor = vec4(u_color.rgb * light, u_color.a);
        }`;

        const progInfo = twgl.createProgramInfo(gl, [vs, fs]);
        const bufferInfo = twgl.primitives.createCubeBufferInfo(gl, 10);

        const projection = m4.identity();
        const camera = m4.identity();
        const view = m4.identity();
        const viewProjection = m4.identity();
        const world = m4.identity();
        const worldViewProjection = m4.identity();
        const worldInverse = m4.identity();
        const worldInverseTranspose = m4.identity();

        const fov = Math.PI / 3;
        const zNear = 0.1;
        const zFar = 100;

        const lightDir = v3.normalize([1, 2, 3]);

        const keys = {};

        let px = 0, py = 1.5, pz = 0; // Posizione della camera
        let ang = 0, elev = 0, roll = 0; // Rotazione della camera
        const speed = 2.0;
        const turnSpeed = 90;

        let then = 0;
        function render(now) {
            now *= 0.001;  
            const deltaTime = now - then;
            then = now;

            twgl.resizeCanvasToDisplaySize(gl.canvas);
            gl.viewport(0, 0, gl.canvas.width, gl.canvas.height);

            gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
            gl.enable(gl.DEPTH_TEST);
            gl.enable(gl.CULL_FACE);

            const aspect = gl.canvas.clientWidth / gl.canvas.clientHeight;
            m4.perspective(fov, aspect, zNear, zFar, projection);

            m4.identity(camera);    
            m4.translate(camera, [px, py, pz], camera);
            m4.rotateX(camera, degToRad(elev), camera);   
            m4.rotateY(camera, degToRad(-ang), camera);   
            m4.rotateZ(camera, degToRad(roll), camera);
            
            m4.inverse(camera, view);
            m4.multiply(projection, view, viewProjection);

            gl.useProgram(progInfo.program);

            for (let z = -1; z <= 1; ++z) {
                for (let y = -1; y <= 1; ++y) {
                    for (let x = -1; x <= 1; ++x) {
                        if (x === 0 && y === 0 && z === 0) continue;
                        
                        m4.identity(world);
                        m4.translate(world, [x * 10, y * 10, z * 10], world);
                        
                        m4.multiply(viewProjection, world, worldViewProjection);
                        m4.inverse(world, worldInverse);
                        m4.transpose(worldInverse, worldInverseTranspose);
                        
                        twgl.setBuffersAndAttributes(gl, progInfo, bufferInfo);
                        twgl.setUniforms(progInfo, {
                            u_worldViewProjection: worldViewProjection,
                            u_worldInverseTranspose: worldInverseTranspose,
                            u_color: [(x + 2) / 3, (y + 2) / 3, (z + 2) / 3, 1],
                            u_lightDir: lightDir,
                        });
                        twgl.drawBufferInfo(gl, bufferInfo);
                    }
                }
            }

            if (keys['87'] || keys['83']) { // W/S per avanti/indietro
                const direction = keys['87'] ? 1 : -1;
                px -= camera[ 8] * deltaTime * speed * direction;
                py -= camera[ 9] * deltaTime * speed * direction;
                pz -= camera[10] * deltaTime * speed * direction;
            }

            if (keys['65'] || keys['68']) { // A/D per girare
                const direction = keys['65'] ? 1 : -1;
                ang += deltaTime * turnSpeed * direction;
            }

            if (keys['81'] || keys['69']) { // Q/E per roll
                const direction = keys['81'] ? 1 : -1;
                roll += deltaTime * turnSpeed * direction;
            }

            if (keys['38'] || keys['40']) { // Su/Giù per elevazione
                const direction = keys['38'] ? 1 : -1;
                elev += deltaTime * turnSpeed * direction;
            }

            requestAnimationFrame(render);
        }
        requestAnimationFrame(render);

        window.addEventListener('keydown', (e) => {
            keys[e.key] = true;
            e.preventDefault();
        });
        window.addEventListener('keyup', (e) => {
            keys[e.key] = false;
            e.preventDefault();
        });

        function degToRad(d) {
            return d * Math.PI / 180;
        }
    </script>
</body>
</html>
