<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebGL FPS Example</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gl-matrix/2.8.1/gl-matrix-min.js"></script>
</head>
<body>
  <script>
    // HTML structure
    const canvas = document.createElement('canvas');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    document.body.appendChild(canvas);
    const gl = canvas.getContext('webgl');

    // Initialize WebGL
    if (!gl) {
      alert('WebGL not supported');
      throw new Error('WebGL not supported');
    }

    // Vertex shader
    const vertexShaderSource = `
      attribute vec3 aPosition;
      uniform mat4 uProjection;
      uniform mat4 uView;
      uniform mat4 uModel;
      void main() {
        gl_Position = uProjection * uView * uModel * vec4(aPosition, 1.0);
      }
    `;

    // Fragment shader
    const fragmentShaderSource = `
      precision mediump float;
      void main() {
        gl_FragColor = vec4(0.3, 0.6, 0.9, 1.0);
      }
    `;

    function compileShader(type, source) {
      const shader = gl.createShader(type);
      gl.shaderSource(shader, source);
      gl.compileShader(shader);
      if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
        throw new Error('Shader compilation failed: ' + gl.getShaderInfoLog(shader));
      }
      return shader;
    }

    // Compile shaders
    const vertexShader = compileShader(gl.VERTEX_SHADER, vertexShaderSource);
    const fragmentShader = compileShader(gl.FRAGMENT_SHADER, fragmentShaderSource);

    // Create and link program
    const program = gl.createProgram();
    gl.attachShader(program, vertexShader);
    gl.attachShader(program, fragmentShader);
    gl.linkProgram(program);
    if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
      throw new Error('Program linking failed: ' + gl.getProgramInfoLog(program));
    }
    gl.useProgram(program);

    // Room vertices
    const roomVertices = new Float32Array([
      -5, -1, -5,   5, -1, -5,   5, -1,  5,  -5, -1,  5, // Floor
      -5,  3, -5,   5,  3, -5,   5,  3,  5,  -5,  3,  5, // Ceiling
      -5, -1, -5,  -5,  3, -5,  -5,  3,  5,  -5, -1,  5, // Left wall
       5, -1, -5,   5,  3, -5,   5,  3,  5,   5, -1,  5, // Right wall
      -5, -1, -5,   5, -1, -5,   5,  3, -5,  -5,  3, -5, // Back wall
      -5, -1,  5,   5, -1,  5,   5,  3,  5,  -5,  3,  5  // Front wall
    ]);
    const roomIndices = new Uint16Array([
      0, 1, 2, 0, 2, 3,   // Floor
      4, 5, 6, 4, 6, 7,   // Ceiling
      8, 9, 10, 8, 10, 11, // Left wall
      12, 13, 14, 12, 14, 15, // Right wall
      16, 17, 18, 16, 18, 19, // Back wall
      20, 21, 22, 20, 22, 23  // Front wall
    ]);

    // Buffer setup
    const vertexBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, vertexBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, roomVertices, gl.STATIC_DRAW);

    const indexBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, indexBuffer);
    gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, roomIndices, gl.STATIC_DRAW);

    // Attribute setup
    const aPosition = gl.getAttribLocation(program, 'aPosition');
    gl.vertexAttribPointer(aPosition, 3, gl.FLOAT, false, 0, 0);
    gl.enableVertexAttribArray(aPosition);

    // Uniforms
    const uProjection = gl.getUniformLocation(program, 'uProjection');
    const uView = gl.getUniformLocation(program, 'uView');
    const uModel = gl.getUniformLocation(program, 'uModel');

    // Matrices
    const projectionMatrix = mat4.create();
    mat4.perspective(projectionMatrix, Math.PI / 4, canvas.width / canvas.height, 0.1, 100);
    gl.uniformMatrix4fv(uProjection, false, projectionMatrix);

    const viewMatrix = mat4.create();
    const modelMatrix = mat4.create();
    gl.uniformMatrix4fv(uView, false, viewMatrix);
    gl.uniformMatrix4fv(uModel, false, modelMatrix);

    // Input handling
    const keys = {};
    window.addEventListener('keydown', e => keys[e.key] = true);
    window.addEventListener('keyup', e => keys[e.key] = false);

    let cameraPosition = [0, 0, 6];
    let cameraRotation = [0, 0];

    // Mouse handling
    canvas.requestPointerLock = canvas.requestPointerLock || canvas.mozRequestPointerLock;
    canvas.onclick = () => canvas.requestPointerLock();
    document.addEventListener('mousemove', (e) => {
      if (document.pointerLockElement === canvas || document.mozPointerLockElement === canvas) {
        const sensitivity = 0.002;
        cameraRotation[0] += e.movementY * sensitivity; // Inverted vertical movement
        cameraRotation[1] -= e.movementX * sensitivity; // Standard horizontal movement
      }
    });

    function updateCamera() {
      const speed = 0.1;
      const forward = [
        Math.sin(cameraRotation[1]) * Math.cos(cameraRotation[0]),
        Math.sin(cameraRotation[0]),
        Math.cos(cameraRotation[1]) * Math.cos(cameraRotation[0])
      ];
      const right = [
        Math.cos(cameraRotation[1]),
        0,
        -Math.sin(cameraRotation[1])
      ];

      if (keys['w']) {
        cameraPosition[0] += forward[0] * speed;
        cameraPosition[1] += forward[1] * speed;
        cameraPosition[2] += forward[2] * speed;
      }
      if (keys['s']) {
        cameraPosition[0] -= forward[0] * speed;
        cameraPosition[1] -= forward[1] * speed;
        cameraPosition[2] -= forward[2] * speed;
      }
      if (keys['a']) {
        cameraPosition[0] -= right[0] * speed;
        cameraPosition[2] -= right[2] * speed;
      }
      if (keys['d']) {
        cameraPosition[0] += right[0] * speed;
        cameraPosition[2] += right[2] * speed;
      }

      mat4.identity(viewMatrix);
      mat4.rotateX(viewMatrix, viewMatrix, cameraRotation[0]);
      mat4.rotateY(viewMatrix, viewMatrix, cameraRotation[1]);
      mat4.translate(viewMatrix, viewMatrix, [-cameraPosition[0], -cameraPosition[1], -cameraPosition[2]]);
      gl.uniformMatrix4fv(uView, false, viewMatrix);
    }

    // Render loop
    function render() {
      gl.clearColor(0.1, 0.1, 0.1, 1);
      gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
      gl.enable(gl.DEPTH_TEST);

      updateCamera();

      gl.drawElements(gl.TRIANGLES, roomIndices.length, gl.UNSIGNED_SHORT, 0);

      requestAnimationFrame(render);
    }
    render();
  </script>
</body>
</html>
