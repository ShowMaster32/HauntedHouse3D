<!DOCTYPE html>
<html lang="en">
<head>
    <title>HauntedHouse - Progetto Computer Graphics A.A.2023/2024</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <link rel="icon" type="image/x-icon" href="images/favicon.ico">
    <link href="https://fonts.googleapis.com/css2?family=Creepster&display=swap" rel="stylesheet">
    <link type="text/css" rel="stylesheet" href="main2.css">
</head>
<body>
    <!-- Menu iniziale -->
    <div id="start-menu">
        <h1>Welcome to HauntedHouse</h1>
        <button id="start-button">START</button>
    </div>
    
    <!-- Canvas per il rendering WebGL -->
    <canvas id="canvas" style="display: none;"></canvas>
    
    <!-- Contenitore principale del gioco -->
    <div id="container" style="display: none;"></div>
    
    <!-- Istruzioni per il giocatore -->
    <div id="instructions" style="visibility: hidden;">Press <span>F</span> to turn on the light</div>
    
    <!-- Mirino centrale -->
    <div id="crosshair" style="display: none;"></div>
    
    <!-- Barra superiore con informazioni -->
    <div id="top-bar" style="display: none;">
        <span id="panel-instructions">Press P to open control panel</span>
        <span id="game-controls" style="margin-left: 20px;"></span>
    </div>
    
    <!-- Pannello laterale di controllo -->
    <div id="side-panel" class="hidden">
        <h2>Control Panel</h2>
        <div id="gui-container"></div>
        <button id="toggleShadows">Toggle Shadows</button>
        <button id="toggleReflections">Toggle Reflections</button>
        <button id="toggleFPS">Toggle FPS Counter</button>
        <button id="advancedRendering">Toggle Advanced Rendering</button>
        <!-- Debug Log Toggle -->
        <button id="toggleDebugLog">Toggle Debug Logs</button>
    </div>
    
    <!-- Audio -->
    <audio id="intro-music" src="sounds/intro.mp3"></audio>
    <audio id="start-music" src="sounds/start-game.mp3"></audio>
    <audio id="random-ghost" src="sounds/random-ghost.mp3"></audio>
    <audio id="la-la-la" src="sounds/la-la-la.mp3"></audio>
    <audio id="demon-laugh" src="sounds/demon-laugh.mp3"></audio>
    
    <!-- Log per debugging -->
    <div id="debug-log" style="display: block;"></div>
    
    <!-- Controlli virtuali per mobile -->
    <div id="mobile-controls" class="mobile-only">
        <button id="move-forward">↑</button>
        <button id="move-backward">↓</button>
        <button id="move-left">←</button>
        <button id="move-right">→</button>
        <button id="toggle-light">L</button>
        <button id="toggle-panel">P</button>
    </div>
    
    <!-- Librerie consentite dal professore -->
    <script src="lib/webgl-utils.js"></script>
    <script src="lib/m4.js"></script>
    <script src="lib/m4-adapter.js"></script>
    <script src="lib/glm_utils.js"></script>
    <script src="lib/glm-adapter.js"></script>
    <script src="lib/mesh_utils.js"></script>
    <script src="lib/dat.gui.js"></script>
    <script src="lib/jquery-3.6.0.js"></script>
    
    <!-- Shader e utility principali -->
    <script src="js/shader-loader.js"></script>
    <script src="js/math-utils.js"></script>
    
    <!-- Script game core -->
    <script src="js/constants.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/physics.js"></script>
    <script src="js/input.js"></script>
    <script src="js/renderer.js"></script>
    <script src="js/game.js"></script>
    <script src="js/main.js"></script>
    
    <!-- Script di inizializzazione -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            console.log("Inizializzazione HauntedHouse");
            
            // Funzione per aggiungere log
            window.logDebug = function(message, type = 'info') {
                // Assicurati che i log siano sempre visibili durante lo sviluppo
                const debugLog = document.getElementById('debug-log');
                if (!debugLog) return;
                
                // Mostra i log sempre in fase di debug
                debugLog.style.display = 'block';
                
                const entry = document.createElement('div');
                entry.className = `log-${type}`;
                
                const timestamp = new Date().toTimeString().substring(0, 8);
                entry.textContent = `[${timestamp}] ${message}`;
                
                debugLog.appendChild(entry);
                debugLog.scrollTop = debugLog.scrollHeight;
                
                // Limita il numero di messaggi
                while (debugLog.children.length > 50) {
                    debugLog.removeChild(debugLog.firstChild);
                }
                
                // Log anche in console per debug
                console.log(`[${type.toUpperCase()}] ${message}`);
            };
            
            // Abilita logging di default
            window.debugLogging = true;
            
            // Setup elementi di base
            const startButton = document.getElementById('start-button');
            const startMenu = document.getElementById('start-menu');
            const canvas = document.getElementById('canvas');
            const container = document.getElementById('container');
            const controlPanel = document.getElementById('side-panel');
            const instructions = document.getElementById('instructions');
            const crosshair = document.getElementById('crosshair');
            const introMusic = document.getElementById('intro-music');
            const startMusic = document.getElementById('start-music');
            const debugLog = document.getElementById('debug-log');
            
            // Toggle per i log di debug
            document.getElementById('toggleDebugLog').addEventListener('click', () => {
                window.debugLogging = !window.debugLogging;
                debugLog.style.display = window.debugLogging ? 'block' : 'none';
                logDebug(`Debug logging ${window.debugLogging ? 'enabled' : 'disabled'}`);
            });
            
            // Mostra i controlli del gioco
            function showGameControls() {
                const gameControls = document.getElementById('game-controls');
                gameControls.innerHTML = `
                    W: Move Forward | 
                    S: Move Backward | 
                    A: Move Left | 
                    D: Move Right | 
                    F: Toggle Light | 
                    P: Open/Close Control Panel
                `;
            }
            
            // Aggiungi controlli virtuali per mobile
            function setupMobileControls() {
                const mobileControls = document.getElementById('mobile-controls');
                
                if (!mobileControls) return;
                
                // Assicurati che i controlli siano accessibili su mobile
                if (window.innerWidth <= 768) {
                    mobileControls.style.display = 'grid';
                }
                
                // Funzioni di movimento mobile
                const moveForward = document.getElementById('move-forward');
                const moveBackward = document.getElementById('move-backward');
                const moveLeft = document.getElementById('move-left');
                const moveRight = document.getElementById('move-right');
                const toggleLight = document.getElementById('toggle-light');
                const togglePanel = document.getElementById('toggle-panel');
                
                // Aggiunge event listener se gli elementi esistono
                if (moveForward) {
                    moveForward.addEventListener('touchstart', (e) => {
                        e.preventDefault();
                        window.gameApp.game.movePlayer('forward', 0.15);
                    });
                }
                
                if (moveBackward) {
                    moveBackward.addEventListener('touchstart', (e) => {
                        e.preventDefault();
                        window.gameApp.game.movePlayer('backward', 0.15);
                    });
                }
                
                if (moveLeft) {
                    moveLeft.addEventListener('touchstart', (e) => {
                        e.preventDefault();
                        window.gameApp.game.movePlayer('left', 0.15);
                    });
                }
                
                if (moveRight) {
                    moveRight.addEventListener('touchstart', (e) => {
                        e.preventDefault();
                        window.gameApp.game.movePlayer('right', 0.15);
                    });
                }
                
                if (toggleLight) {
                    toggleLight.addEventListener('touchstart', (e) => {
                        e.preventDefault();
                        window.gameApp.game.toggleLight();
                    });
                }
                
                if (togglePanel) {
                    togglePanel.addEventListener('touchstart', (e) => {
                        e.preventDefault();
                        window.gameApp.game.togglePanel();
                    });
                }
            }
            
            // Debug keyboard status
            function setupKeyboardDebug() {
                document.addEventListener('keydown', (e) => {
                    logDebug(`KeyDown: ${e.code}`);
                });
                
                document.addEventListener('keyup', (e) => {
                    logDebug(`KeyUp: ${e.code}`);
                });
            }
            
            // Avvia la musica dell'intro quando viene caricata la pagina
            window.onload = () => {
                introMusic.play().catch(e => {
                    logDebug('Audio autoplay blocked by browser policy. Click anywhere to enable sounds.', 'warning');
                    document.addEventListener('click', () => {
                        introMusic.play();
                    }, { once: true });
                });
                
                // Setup debug keyboard
                setupKeyboardDebug();
            };
            
            // Evento click per avviare il gioco
            startButton.addEventListener('click', () => {
                logDebug('Inizializzazione gioco dopo click su START');
                
                // Nascondi il menu e mostra gli elementi di gioco
                startMenu.style.display = 'none';
                
                canvas.style.display = 'block';
                container.style.display = 'block';
                instructions.style.visibility = 'visible';
                crosshair.style.display = 'block';
                
                // Mostra la barra superiore con la legenda dei comandi
                document.getElementById('top-bar').style.display = 'flex';
                showGameControls();
                
                // Imposta le dimensioni del canvas
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
                
                // Crea l'applicazione di gioco
                const app = new GameApplication();
                window.gameApp = app;
                
                // Inizializza e avvia il gioco
                app.initialize().then(() => {
                    logDebug('Gioco inizializzato con successo');
                    
                    // Setup controlli mobile
                    setupMobileControls();
                    
                    // Ferma la musica di intro e avvia quella di gioco
                    introMusic.pause();
                    startMusic.play().catch(e => logDebug('Failed to play start music: ' + e, 'warning'));
                    
                    // Assicurati che il gioco sia avviato
                    if (app.game) {
                        app.game.start();
                        logDebug('Game.start() chiamato');
                    } else {
                        logDebug('Game non disponibile dopo inizializzazione', 'error');
                    }
                    
                    // Blocca il puntatore con un piccolo ritardo
                    setTimeout(() => {
                        try {
                            canvas.requestPointerLock();
                        } catch (e) {
                            logDebug('Pointer lock not supported or permission denied: ' + e, 'warning');
                        }
                    }, 100);
                    
                    document.body.style.cursor = 'none';
                }).catch(error => {
                    logDebug('Failed to initialize game: ' + error, 'error');
                    // Mostra errore all'utente
                    alert('Si è verificato un errore nell\'inizializzazione del gioco: ' + error);
                });
            });
            
            // Gestione responsiva per il canvas
            window.addEventListener('resize', () => {
                if (canvas) {
                    canvas.width = window.innerWidth;
                    canvas.height = window.innerHeight;
                    
                    // Aggiorna posizione top-bar
                    const topBar = document.getElementById('top-bar');
                    if (topBar) {
                        topBar.style.left = '50%';
                        topBar.style.transform = 'translateX(-50%)';
                    }
                    
                    // Aggiorna display controlli mobile
                    const mobileControls = document.getElementById('mobile-controls');
                    if (mobileControls) {
                        mobileControls.style.display = window.innerWidth <= 768 ? 'grid' : 'none';
                    }
                    
                    if (window.gameApp && window.gameApp.game) {
                        window.gameApp.game.handleResize(window.innerWidth, window.innerHeight);
                    }
                }
            });
            
            // Gestione degli errori globali
            window.addEventListener('error', (event) => {
                logDebug('Global error: ' + (event.error ? event.error.message : event.message), 'error');
                console.error('Error:', event.error || event.message);
            });
            
            // Patch per Game.prototype.movePlayer
            const originalGameMovement = Game.prototype.movePlayer;
            Game.prototype.movePlayer = function(direction, speed) {
                logDebug(`Game.movePlayer chiamato: ${direction}, ${speed}`);
                
                // Valida la rotazione della camera
                if (!this.camera || typeof this.camera.rotation !== 'object' || typeof this.camera.rotation.y !== 'number') {
                    logDebug('Rotazione camera non valida per calcolo movimento', 'error');
                    return;
                }
                
                // Calcola la direzione di movimento sul piano XZ
                const yaw = this.camera.rotation.y;
                let moveX = 0;
                let moveZ = 0;

                switch(direction) {
                    case 'forward':
                        moveX = Math.sin(yaw) * speed;
                        moveZ = -Math.cos(yaw) * speed;
                        break;
                    case 'backward':
                        moveX = -Math.sin(yaw) * speed;
                        moveZ = Math.cos(yaw) * speed;
                        break;
                    case 'left':
                        moveX = -Math.cos(yaw) * speed;
                        moveZ = -Math.sin(yaw) * speed;
                        break;
                    case 'right':
                        moveX = Math.cos(yaw) * speed;
                        moveZ = Math.sin(yaw) * speed;
                        break;
                }

                // Verifica valori validi
                if (isNaN(moveX) || isNaN(moveZ)) {
                    logDebug(`Movimento non valido: moveX=${moveX}, moveZ=${moveZ}, yaw=${yaw}`, 'error');
                    // Usa valori di default
                    moveX = 0;
                    moveZ = direction === 'forward' ? -speed : (direction === 'backward' ? speed : 0);
                }

                // Log di movimento
                logDebug(`Movimento: dir=${direction}, yaw=${yaw.toFixed(2)}, moveX=${moveX.toFixed(2)}, moveZ=${moveZ.toFixed(2)}`);
                
                // Aggiorna sia la velocità per la fisica
                this.playerVelocity[0] += moveX;
                this.playerVelocity[2] += moveZ;
                
                // E anche la posizione direttamente per un movimento più immediato
                this.player.position[0] += moveX;
                this.player.position[2] += moveZ;
                
                // Forza un update della camera
                if (this.updateCamera) {
                    this.updateCamera();
                }
            };
            
            logDebug('Setup iniziale completato');
        });
    </script>
</body>
</html>
