<!DOCTYPE html>
<html lang="en">
<head>
    <title>Progetto CG A.A.2023/2024</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <!-- Menu iniziale -->
    <div id="start-menu">
        <h1>Casa Infestata</h1>
        <button id="start-button">START</button>
    </div>
    
    <!-- Canvas per il rendering WebGL -->
    <canvas id="gl-canvas"></canvas>
    
    <!-- Interfaccia utente -->
    <div id="crosshair"></div>
    <div id="instructions" style="visibility: hidden;">Premi <span style="color:#ff4d4d">F</span> per accendere la luce</div>
    <div id="top-bar">
        <span id="panel-instructions">Premi P per aprire il pannello di controllo</span>
        <span id="game-controls"></span>
    </div>
    
    <!-- Pannello di controllo richiesto nel progetto -->
    <div id="side-panel" class="hidden">
        <h2>Pannello di Controllo</h2>
        <button id="toggleShadows">Attiva/Disattiva Ombre</button>
        <button id="toggleReflections">Attiva/Disattiva Riflessioni</button>
        <button id="toggleFPS">Attiva/Disattiva FPS</button>
        <button id="toggleLogs">Attiva/Disattiva Log</button>
        <button id="toggleCameraInfo">Attiva/Disattiva Info Camera</button>
        <button id="toggleSpectatorMode">Modalità Spettatore</button>
        <button id="toggleExternalLight">Luce Esterna</button>
        <button id="toggleRoomLight">Luce Stanza</button>
        <button id="advancedRendering">Rendering Avanzato</button>
    </div>
    
    <!-- Container per i log e debug info -->
    <div id="log-container" style="display: none;"></div>
    <div id="camera-coords" style="display: none;"></div>

    <!-- Controlli touch per dispositivi mobili (nascosti di default) -->
    <div class="touch-controls" style="display: none;">
        <div class="touch-button" id="touch-forward">W</div>
        <div class="touch-button" id="touch-left">A</div>
        <div class="touch-button" id="touch-backward">S</div>
        <div class="touch-button" id="touch-right">D</div>
        <div class="touch-button" id="touch-light">F</div>
    </div>
    
    <!-- Inclusione delle librerie richieste dal professore -->
    <script src="lib/glm_utils.js"></script>
    <script src="lib/mesh_utils.js"></script>
    <script src="lib/webgl-utils.js"></script>
    <script src="lib/m4.js"></script>
    <script src="lib/dat.gui.js"></script>
    <script src="lib/jquery-3.6.0.js"></script>

    <!-- Vertex Shader -->
    <script id="vertex-shader" type="x-shader/x-vertex">
        attribute vec4 a_position;
        attribute vec3 a_normal;
        attribute vec2 a_texcoord;

        uniform mat4 u_model;
        uniform mat4 u_view;
        uniform mat4 u_projection;
        uniform mat4 u_normalMatrix;
        uniform mat4 u_lightSpaceMatrix;
        uniform bool u_isEmissive;

        varying vec3 v_normal;
        varying vec3 v_position;
        varying vec2 v_texcoord;
        varying float v_isEmissive;
        varying vec4 v_fragPosLightSpace;

        void main() {
            // Calcola posizione nello spazio mondo
            vec4 worldPosition = u_model * a_position;
            v_position = worldPosition.xyz;
            
            // Trasforma normale usando matrice normale
            v_normal = mat3(u_normalMatrix) * a_normal;
            
            // Passa coordinate texture
            v_texcoord = a_texcoord;
            
            // Calcola posizione nello spazio della luce per le ombre
            v_fragPosLightSpace = u_lightSpaceMatrix * worldPosition;
            
            // Flag emissivo
            v_isEmissive = u_isEmissive ? 1.0 : 0.0;
            
            // Posizione finale del vertice
            gl_Position = u_projection * u_view * worldPosition;
        }
    </script>
    
    <!-- Fragment Shader -->
    <script id="fragment-shader" type="x-shader/x-fragment">
        precision mediump float;
        
        uniform vec3 u_lightPos;
        uniform vec3 u_viewPos;
        uniform bool u_useTexture;
        uniform sampler2D u_texture;
        uniform bool u_shadows;
        uniform bool u_reflections;
        uniform bool u_advancedRendering;
        uniform sampler2D u_shadowMap;
        uniform vec3 u_externalLightColor;
        uniform float u_externalLightIntensity;
        uniform bool u_lightOn;          // Luce interna (lampadario)
        uniform bool u_externalLightOn;  // Luce esterna (per la skybox)
        
        varying vec3 v_normal;
        varying vec3 v_position;
        varying vec2 v_texcoord;
        varying float v_isEmissive;
        varying vec4 v_fragPosLightSpace;
        
        // Funzione per calcolare l'ombra
        float calculateShadow(vec4 fragPosLightSpace) {
            // Esegue la divisione prospettica
            vec3 projCoords = fragPosLightSpace.xyz / fragPosLightSpace.w;
            
            // Trasforma da [-1,1] a [0,1]
            projCoords = projCoords * 0.5 + 0.5;
            
            // Ottiene la profondità più vicina dal punto di vista della luce
            float closestDepth = texture2D(u_shadowMap, projCoords.xy).r;
            
            // Profondità attuale del frammento dal punto di vista della luce
            float currentDepth = projCoords.z;
            
            // Calcola bias basato sull'angolo tra normale e direzione della luce
            vec3 normal = normalize(v_normal);
            vec3 lightDir = normalize(u_lightPos - v_position);
            float bias = max(0.05 * (1.0 - dot(normal, lightDir)), 0.005);
            
            // Esegue PCF (Percentage Closer Filtering) per ombre più morbide
            float shadow = 0.0;
            vec2 texelSize = vec2(1.0) / vec2(1024.0); // Dimensione della shadow map
            for(int x = -1; x <= 1; ++x) {
                for(int y = -1; y <= 1; ++y) {
                    float pcfDepth = texture2D(u_shadowMap, projCoords.xy + vec2(x, y) * texelSize).r;
                    shadow += currentDepth - bias > pcfDepth ? 1.0 : 0.0;
                }
            }
            shadow /= 9.0;
            
            // Mantieni l'ombra a 0.0 quando fuori dalla frustum della luce
            if(projCoords.z > 1.0)
                shadow = 0.0;
                
            return shadow;
        }
        
        void main() {
            vec3 normal = normalize(v_normal);
            vec3 lightDir = normalize(u_lightPos - v_position);
            
            // Colore base (dalla texture o predefinito)
            vec3 color;
            if (u_useTexture) {
                color = texture2D(u_texture, v_texcoord).rgb;
            } else {
                color = vec3(0.8, 0.8, 0.8);
            }
            
            // Se è un oggetto emissivo (luce), renderizzalo brillante
            if (v_isEmissive > 0.5) {
                float brightness = u_lightOn ? 1.0 : 0.2;
                gl_FragColor = vec4(color * brightness, 1.0);
                return;
            }
            
            // Ambient - aumentata per avere più luce di base
            float ambientStrength = 0.15;
            vec3 ambient = ambientStrength * color;
            
            // Luce esterna (dalle finestre)
            vec3 externalLight = vec3(0.0);
            if (u_externalLightOn) {
                externalLight = u_externalLightIntensity * u_externalLightColor * color;
            }
            
            // Luce interna (dal lampadario) solo se accesa
            vec3 diffuse = vec3(0.0);
            vec3 specular = vec3(0.0);
            
            if (u_lightOn) {
                // Usiamo il valore assoluto per illuminare entrambi i lati delle superfici
                // Questo è importante per pavimento e soffitto a seconda della direzione della normale
                float diff = max(abs(dot(normal, lightDir)), 0.0);
                diffuse = diff * vec3(1.0, 0.9, 0.7) * color;  // Luce calda giallognola
                
                // Specular solo se riflessi abilitati
                if (u_reflections) {
                    float specularStrength = 0.5;
                    vec3 viewDir = normalize(u_viewPos - v_position);
                    vec3 halfwayDir = normalize(lightDir + viewDir);
                    // Usiamo Blinn-Phong per riflessi migliori
                    float spec = pow(max(dot(normal, halfwayDir), 0.0), 64.0);
                    specular = specularStrength * spec * vec3(1.0, 0.9, 0.7);
                }
            }
            
            // Ombra solo per la luce interna
            float shadow = 0.0;
            if (u_shadows && u_lightOn) {
                shadow = calculateShadow(v_fragPosLightSpace);
                // Limitiamo l'effetto dell'ombra per evitare zone completamente nere
                shadow = min(shadow, 0.75);
            }
            
            // Attenuazione della luce con la distanza - migliorata
            float attenuation = 1.0;
            if (u_lightOn) {
                float distance = length(u_lightPos - v_position);
                // Parametri di attenuazione ottimizzati per interni
                float constant = 1.0;
                float linear = 0.09;
                float quadratic = 0.032;
                attenuation = 1.0 / (constant + linear * distance + quadratic * distance * distance);
                
                // Aumento minimo dell'attenuazione per evitare zone troppo scure
                attenuation = max(attenuation, 0.1);
            }
            
            // Rendering avanzato (aggiunge effetti speciali)
            if (u_advancedRendering) {
                // Effetto vignette (bordi scuri)
                vec2 center = vec2(0.5, 0.5);
                float dist = distance(v_texcoord, center);
                float vignette = smoothstep(0.5, 0.35, dist);
                
                // Applica vignette all'illuminazione
                attenuation *= vignette;
                
                // Aggiungi effetto di emissione ambientale (ambient occlusion semplificato)
                float ao = 1.0 - 0.2 * max(0.0, 1.0 - length(v_normal.xz));
                ambient *= ao;
            }
            
            // Combina le luci - la formula è stata migliorata
            vec3 result = ambient + externalLight + (1.0 - shadow) * (diffuse + specular) * attenuation;
            
            // Tonemapping per HDR
            // Usiamo ACES filmic tone mapping per risultati più cinematografici
            const float a = 2.51;
            const float b = 0.03;
            const float c = 2.43;
            const float d = 0.59;
            const float e = 0.14;
            result = clamp((result * (a * result + b)) / (result * (c * result + d) + e), 0.0, 1.0);
            
            // Output finale
            gl_FragColor = vec4(result, 1.0);
        }
    </script>
    
    <!-- Shadow Vertex Shader -->
    <script id="shadow-vertex-shader" type="x-shader/x-vertex">
        attribute vec4 a_position;
        
        uniform mat4 u_model;
        uniform mat4 u_lightSpaceMatrix;
        
        void main() {
            gl_Position = u_lightSpaceMatrix * u_model * a_position;
        }
    </script>
    
    <!-- Shadow Fragment Shader -->
    <script id="shadow-fragment-shader" type="x-shader/x-fragment">
        precision mediump float;
        
        void main() {
            // Questo shader non scrive colori, solo profondità
        }
    </script>
    
    <!-- Skybox Vertex Shader -->
    <script id="skybox-vertex-shader" type="x-shader/x-vertex">
        attribute vec4 a_position;
        
        uniform mat4 u_view;
        uniform mat4 u_projection;
        
        varying vec3 v_texCoord;
        
        void main() {
            vec4 position = u_projection * mat4(mat3(u_view)) * a_position;
            gl_Position = position.xyww;
            v_texCoord = a_position.xyz;
        }
    </script>
    
    <!-- Skybox Fragment Shader -->
    <script id="skybox-fragment-shader" type="x-shader/x-fragment">
        precision mediump float;
        
        uniform samplerCube u_skybox;
        uniform bool u_externalLightOn;
        
        varying vec3 v_texCoord;
        
        void main() {
            vec3 color = textureCube(u_skybox, v_texCoord).rgb;
            
            // Scurisci il cielo se la luce è spenta
            if (!u_externalLightOn) {
                color *= 0.2;
            }
            
            gl_FragColor = vec4(color, 1.0);
        }
    </script>

    <!-- Logica principale dell'applicazione -->
    <script src="main.js"></script>
</body>
</html>
