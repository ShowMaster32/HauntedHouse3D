<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="HauntedHouse Game - A WebGL Interactive Experience">
    <title>HauntedHouse</title>

    <!-- Favicon and Fonts -->
    <link rel="icon" href="./images/favicon.ico" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Creepster&display=swap" rel="stylesheet">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="./styles/main.css">
</head>
<body>
    <!-- Start Menu -->
    <div id="start-menu">
        <h1>Welcome to HauntedHouse</h1>
        <button id="start-button">START</button>
    </div>

    <!-- Main Canvas for Rendering -->
    <canvas id="canvas" style="display: none;"></canvas>

    <!-- Game Container -->
    <div id="container" style="display: none;"></div>

    <!-- Instructions -->
    <div id="instructions" style="visibility: hidden;">
        Press <span>F</span> to turn on the light
    </div>

    <!-- Crosshair -->
    <div id="crosshair" style="display: none;"></div>

    <!-- Top Bar -->
    <div id="top-bar" style="display: none;">
        <span id="panel-instructions">Press P to open control panel</span>
        <span id="game-controls" style="margin-left: 20px;"></span>
    </div>

    <!-- Side Panel -->
    <div id="side-panel" class="hidden">
        <h2>Control Panel</h2>
        <button id="toggleShadows">Toggle Shadows</button>
        <button id="toggleReflections">Toggle Reflections</button>
        <button id="advancedRendering">Toggle Advanced Rendering</button>
    </div>

    <!-- Audio Elements -->
    <audio id="intro-music" src="./sounds/intro.mp3"></audio>
    <audio id="start-music" src="./sounds/start-game.mp3"></audio>
    <audio id="random-ghost" src="./sounds/random-ghost.mp3"></audio>
    <audio id="la-la-la" src="./sounds/la-la-la.mp3"></audio>
    <audio id="demon-laugh" src="./sounds/demon-laugh.mp3"></audio>

    <!-- Libraries -->
    <script src="./libs/webgl-utils.js"></script>
    <script src="./libs/glm-js.min.js"></script>
    <script src="./libs/dat.gui.min.js"></script>
    <script src="./libs/jquery-3.6.0.min.js"></script>
    <script src="./libs/m4.js"></script>
    <script src="./libs/gl-matrix-min.js"></script>

    <!-- Game Scripts -->
    <script type="module" src="./scripts/main.js"></script>
    <script type="module" src="./scripts/environment.js"></script>
    <script type="module" src="./scripts/models.js"></script>
    <script type="module" src="./scripts/player.js"></script>
    <script type="module" src="./scripts/audio.js"></script>
    <script type="module" src="./scripts/shaders.js"></script>
    <script type="module" src="./scripts/utils.js"></script>
    <script type="module" src="./scripts/lighting.js"></script>
    <script type="module" src="./scripts/math.js"></script>

</body>
</html>
