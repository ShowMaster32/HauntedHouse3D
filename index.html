<!DOCTYPE html>
<html lang="en">
<head>
    <title>Progetto CG A.A.2023/2024</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <!-- Menu iniziale -->
    <div id="start-menu">
        <h1>Casa Infestata</h1>
        <button id="start-button">START</button>
    </div>
    
    <!-- Canvas per il rendering WebGL -->
    <canvas id="gl-canvas"></canvas>
    
    <!-- Interfaccia utente -->
    <div id="crosshair"></div>
    <div id="instructions" style="visibility: hidden;">Premi <span style="color:#ff4d4d">F</span> per accendere la luce</div>
    <div id="top-bar">
        <span id="panel-instructions">Premi P per aprire il pannello di controllo</span>
        <span id="game-controls"></span>
    </div>
    
    <!-- Pannello di controllo richiesto nel progetto -->
    <div id="side-panel" class="hidden">
        <h2>Pannello di Controllo</h2>
        <button id="toggleShadows">Attiva/Disattiva Ombre</button>
        <button id="toggleReflections">Attiva/Disattiva Riflessioni</button>
        <button id="toggleFPS">Attiva/Disattiva FPS</button>
        <button id="toggleLogs">Attiva/Disattiva Log</button>
        <button id="toggleCameraInfo">Attiva/Disattiva Info Camera</button>
        <button id="toggleSpectatorMode">Modalità Spettatore</button>
        <button id="toggleExternalLight">Luce Esterna</button>
        <button id="toggleRoomLight">Luce Stanza</button>
        <button id="advancedRendering">Rendering Avanzato</button>
    </div>
    
    <!-- Container per i log e debug info -->
    <div id="log-container" style="display: none;"></div>
    <div id="camera-coords" style="display: none;"></div>

    <!-- Controlli touch per dispositivi mobili (nascosti di default) -->
    <div class="mobile-controls" id="mobile-controls">
        <!-- Pad direzionale (sinistra) -->
        <div class="direction-pad">
            <div class="direction-btn up" id="touch-forward" data-key="KeyW">
                <span>W</span>
            </div>
            <div class="direction-btn left" id="touch-left" data-key="KeyA">
                <span>A</span>
            </div>
            <div class="direction-btn down" id="touch-backward" data-key="KeyS">
                <span>S</span>
            </div>
            <div class="direction-btn right" id="touch-right" data-key="KeyD">
                <span>D</span>
            </div>
        </div>

        <!-- Controlli azione (destra) -->
        <div class="action-controls">
            <div class="action-btn light" id="touch-light" data-key="KeyF">
                <span>F</span>
            </div>
            <div class="action-btn panel" id="touch-panel" data-key="KeyP">
                <span>P</span>
            </div>
        </div>

        <!-- Controlli spettatore (mostrati solo in modalità spettatore) -->
        <div class="spectator-controls" id="spectator-controls">
            <div class="spectator-btn" id="touch-descend" data-key="KeyQ">
                <span>Q</span>
            </div>
            <div class="spectator-btn" id="touch-ascend" data-key="KeyE">
                <span>E</span>
            </div>
        </div>
    </div>

    <!-- Controllo camera mobile -->
    <div class="camera-control" id="camera-control">
        <span>👁️</span>
    </div>

    <!-- Indicatore interazione mobile -->
    <div class="mobile-interaction-hint" id="mobile-interaction-hint">
        Tocca F per interagire
    </div>
    
    <!-- Inclusione delle librerie richieste dal professore -->
    <script src="lib/glm_utils.js"></script>
    <script src="lib/mesh_utils.js"></script>
    <script src="lib/webgl-utils.js"></script>
    <script src="lib/m4.js"></script>
    <script src="lib/dat.gui.js"></script>
    <script src="lib/jquery-3.6.0.js"></script>

    <!-- Vertex Shader -->
    <script id="vertex-shader" type="x-shader/x-vertex">
        attribute vec4 a_position;
        attribute vec3 a_normal;
        attribute vec2 a_texcoord;

        uniform mat4 u_model;
        uniform mat4 u_view;
        uniform mat4 u_projection;
        uniform mat4 u_normalMatrix;
        uniform mat4 u_lightSpaceMatrix;
        uniform bool u_isEmissive;

        varying vec3 v_normal;
        varying vec3 v_position;
        varying vec2 v_texcoord;
        varying float v_isEmissive;
        varying vec4 v_fragPosLightSpace;

        void main() {
            // Calcola posizione nello spazio mondo
            vec4 worldPosition = u_model * a_position;
            v_position = worldPosition.xyz;
            
            // Trasforma normale usando matrice normale
            v_normal = mat3(u_normalMatrix) * a_normal;
            
            // Passa coordinate texture
            v_texcoord = a_texcoord;
            
            // Calcola posizione nello spazio della luce per le ombre
            v_fragPosLightSpace = u_lightSpaceMatrix * worldPosition;
            
            // Flag emissivo
            v_isEmissive = u_isEmissive ? 1.0 : 0.0;
            
            // Posizione finale del vertice
            gl_Position = u_projection * u_view * worldPosition;
        }
    </script>
    
    <!-- Fragment Shader -->
    <script id="fragment-shader" type="x-shader/x-fragment">
precision highp float;

uniform vec3 u_lightPos;
uniform vec3 u_viewPos;
uniform bool u_useTexture;
uniform sampler2D u_texture;
uniform bool u_shadows;
uniform bool u_reflections;
uniform bool u_advancedRendering;
uniform sampler2D u_shadowMap;
uniform vec3 u_externalLightColor;
uniform float u_externalLightIntensity;
uniform bool u_lightOn;
uniform bool u_externalLightOn;
uniform float u_lightIntensity;
uniform float u_shadowBias;
uniform int u_shadowSamples;

varying vec3 v_normal;
varying vec3 v_position;
varying vec2 v_texcoord;
varying float v_isEmissive;
varying vec4 v_fragPosLightSpace;

// Funzione PCF migliorata per ombre più visibili
float calculateShadowPCF(vec4 fragPosLightSpace, vec3 normal, vec3 lightDir) {
    vec3 projCoords = fragPosLightSpace.xyz / fragPosLightSpace.w;
    projCoords = projCoords * 0.5 + 0.5;
    
    // Check bounds
    if (projCoords.z > 1.0 || projCoords.x < 0.0 || projCoords.x > 1.0 || 
        projCoords.y < 0.0 || projCoords.y > 1.0) {
        return 0.0;
    }
    
    float currentDepth = projCoords.z;
    
    // Bias dinamico basato sull'angolo tra normale e luce
    float bias = max(0.005 * (1.0 - dot(normal, lightDir)), 0.001);
    
    // Bias speciale per superfici orizzontali (pavimento)
    if (abs(normal.y) > 0.9) {
        bias = 0.002; // Bias ridotto per il pavimento
    }
    
    float shadow = 0.0;
    vec2 texelSize = vec2(1.0 / 2048.0);
    
    // PCF 5x5 per ombre più morbide sul pavimento
    int samples = 0;
    for(int x = -2; x <= 2; ++x) {
        for(int y = -2; y <= 2; ++y) {
            vec4 rgbaDepth = texture2D(u_shadowMap, projCoords.xy + vec2(x, y) * texelSize);
            float pcfDepth = rgbaDepth.r;
            if ((currentDepth - bias) > pcfDepth) {
                shadow += 1.0;
            }
            samples++;
        }
    }
    shadow /= float(samples);
    
    // Intensifica le ombre
    shadow = clamp(shadow * 1.2, 0.0, 1.0);
    
    return shadow;
}

void main() {
    vec3 normal = normalize(v_normal);
    vec3 lightDir = normalize(u_lightPos - v_position);
    
    // Colore base dalla texture
    vec4 color;
    if (u_useTexture) {
        color = texture2D(u_texture, v_texcoord);
    } else {
        color = vec4(0.8, 0.8, 0.8, 1.0);
    }
    
    // Oggetti emissivi (lampada)
    if (v_isEmissive > 0.5) {
        float brightness = u_lightOn ? 3.0 : 0.5;
        gl_FragColor = vec4(color.rgb * brightness, color.a);
        return;
    }
    
    // Illuminazione ambientale base
    float ambientStrength = u_externalLightOn ? 0.15 : 0.08;
    vec3 ambient = ambientStrength * color.rgb;
    
    // Luce esterna
    vec3 externalLight = vec3(0.0);
    if (u_externalLightOn) {
        externalLight = u_externalLightIntensity * 0.3 * u_externalLightColor * color.rgb;
    }
    
    // Luce interna (dalla lampada)
    vec3 diffuse = vec3(0.0);
    vec3 specular = vec3(0.0);
    
    if (u_lightOn) {
        float distance = length(u_lightPos - v_position);
        float attenuation = 1.0 / (1.0 + 0.045 * distance + 0.0075 * distance * distance);
        
        float baseIntensity = u_lightIntensity * 0.7;
        
        // Diffuse lighting
        float dotNL = max(dot(normal, lightDir), 0.0);

if (abs(normal.y) > 0.7) {
    dotNL = max(dotNL, 0.3); // Minimo 30% di illuminazione per superfici orizzontali
}

        diffuse = dotNL * vec3(1.0, 0.95, 0.85) * color.rgb * baseIntensity * attenuation;
        
        // Boost per superfici orizzontali
        if (abs(normal.y) > 0.7) {
    // Per il pavimento (normale verso +Y) forza illuminazione
    if (normal.y > 0.0) {
        diffuse *= 4.0; // Boost maggiore per il pavimento
    }
    // Per il soffitto (normale verso -Y) forza illuminazione  
    else {
        diffuse *= 3.0; // Boost per il soffitto
    }
}
        
        // Specular lighting
        if (u_reflections && dotNL > 0.0) {
            vec3 viewDir = normalize(u_viewPos - v_position);
            vec3 reflectDir = reflect(-lightDir, normal);
            float spec = pow(max(dot(viewDir, reflectDir), 0.0), 32.0);
            specular = 0.3 * spec * vec3(1.0, 0.95, 0.85) * attenuation;
        }
    }
    
    // CALCOLO OMBRE MIGLIORATO
    float shadow = 0.0;
    if (u_shadows && u_lightOn) {
        shadow = calculateShadowPCF(v_fragPosLightSpace, normal, lightDir);
    }
    
    // APPLICAZIONE OMBRE PIÙ DRASTICA
    vec3 finalColor = ambient + externalLight;
    
    if (u_shadows && u_lightOn) {
        // Applica le ombre in modo più evidente
        vec3 litColor = diffuse + specular;
        
        // Mescola tra luce piena e ombra profonda
        // shadow = 0.0 -> completamente illuminato
        // shadow = 1.0 -> completamente in ombra
        vec3 shadowedColor = litColor * (1.0 - shadow * 0.8); // Riduce la luce dell'80% nelle ombre
        
        finalColor += shadowedColor;
        
        // Aggiungi un tono blu/viola sottile nelle ombre per maggiore realismo
        if (shadow > 0.1) {
            finalColor = mix(finalColor, finalColor * vec3(0.8, 0.85, 1.0), shadow * 0.3);
        }
    } else {
        // Senza ombre, aggiungi illuminazione normale
        finalColor += diffuse + specular;
    }
    
    // Assicura che ci sia sempre un minimo di visibilità
    finalColor = max(finalColor, color.rgb * 0.05);
    
    // Effetti avanzati opzionali
    if (u_advancedRendering) {
        // Ambient Occlusion semplificato
        float aoFactor = 1.0 - 0.1 * max(0.0, 1.0 - length(v_normal.xz));
        finalColor *= aoFactor;
        
        // Tone mapping ACES semplificato
        finalColor = finalColor / (finalColor + vec3(0.155)) * 1.019;
        
        // Gamma correction
        finalColor = pow(finalColor, vec3(1.0 / 2.2));
    }
    
    // Clamp finale per sicurezza
    finalColor = clamp(finalColor, 0.0, 1.0);
    
    gl_FragColor = vec4(finalColor, color.a);
}
</script>
    
    <!-- Shadow Vertex Shader -->
    <script id="shadow-vertex-shader" type="x-shader/x-vertex">
        attribute vec4 a_position;
        
        uniform mat4 u_model;
        uniform mat4 u_lightSpaceMatrix;
        
        void main() {
            gl_Position = u_lightSpaceMatrix * u_model * a_position;
        }
    </script>
    
    <!-- Shadow Fragment Shader -->
    <script id="shadow-fragment-shader" type="x-shader/x-fragment">
        precision mediump float;
        
        void main() {
            // Scrivi la profondità nel canale RGBA per WebGL 1.0
            // Pack depth value in RGBA
            float depth = gl_FragCoord.z;
            
            // Pack float in RGBA (tecnica per WebGL 1.0)
            vec4 rgba = vec4(
                fract(depth * 255.0),
                fract(depth * 255.0 * 255.0),
                fract(depth * 255.0 * 255.0 * 255.0),
                1.0
            );
            
            gl_FragColor = rgba;
        }
    </script>
    
    <!-- Skybox Vertex Shader -->
    <script id="skybox-vertex-shader" type="x-shader/x-vertex">
        attribute vec4 a_position;
        
        uniform mat4 u_view;
        uniform mat4 u_projection;
        
        varying vec3 v_texCoord;
        
        void main() {
            vec4 position = u_projection * mat4(mat3(u_view)) * a_position;
            gl_Position = position.xyww;
            v_texCoord = a_position.xyz;
        }
    </script>
    
    <!-- Skybox Fragment Shader -->
    <script id="skybox-fragment-shader" type="x-shader/x-fragment">
        precision mediump float;
        
        uniform samplerCube u_skybox;
        uniform bool u_externalLightOn;
        
        varying vec3 v_texCoord;
        
        void main() {
            vec4 skyColor = textureCube(u_skybox, v_texCoord);
            
            // Modula l'intensità in base alla luce esterna
            float intensity = u_externalLightOn ? 1.0 : 0.3;
            
            gl_FragColor = vec4(skyColor.rgb * intensity, 1.0);
        }
    </script>

    <!-- Logica principale dell'applicazione -->
    <script src="main.js"></script>
</body>
</html>
